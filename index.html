  var corpus = chapters.map(function(c){return {kind:'chapter',o:c};})
    .concat(secrets.map(function(s){return {kind:'secret',o:s};}))
    .concat(PEOPLE.map(function(p){return {kind:'person',o:p};}));
  var res=[];
  corpus.forEach(function(e){
    var o=e.o, score=0, ok=true;
    terms.forEach(function(t){ var n=(o._lc||'').split(t).length-1; if(n===0) ok=false; score+=n; });
    if(ok) res.push({e:e,score:score});
  });
  res.sort(function(a,b){return b.score-a.score;});
  var rx = new RegExp('('+terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','ig');
  var html = '<div class="count">'+res.length+' result'+(res.length!==1?'s':'')+' match “'+esc(query)+'”</div>';
  if(!res.length){ html += '<div class="hint">Nothing contains all of those words. Try fewer or different terms.</div>'; }
  res.forEach(function(r){
    var e=r.e, o=e.o, isSec=e.kind==='secret', isPer=e.kind==='person';
    var pos=o._lc.search(rx); if(pos<0)pos=0;
    var start=Math.max(0,pos-90), snip=o.text.slice(start, start+240);
    if(start>0) snip='…'+snip; if(start+240 < o.text.length) snip=snip+'…';
    snip = esc(snip).replace(rx,'<mark>$1</mark>');
    var href = (isPer ? '#/who/' : isSec ? '#/secret/' : '#/read/') + o.id;
    var tag = isPer ? esc(o.group) : isSec ? 'Lore' : ('Book '+esc(o.book)+' · '+esc(o.label));
    html += '<div class="entry"><span class="ttl"><a class="t" href="'+href+'">'+esc(o.title)+'</a>'
      + '<div class="snip">'+snip+'</div></span>'
      + '<span class="d">'+tag+'</span></div>';
  });
  app.innerHTML = html; window.scrollTo(0,0);
}

/* ---------- routing & events ---------- */
/* ---------- chapter navigation ----------
   The nav lives in the sticky header while a chapter is open, and is emptied on every other
   view. SWIPE carries the neighbouring chapter ids for the touch gesture that stands in for
   those buttons on a phone. */
var SWIPE = {prev:null, next:null};
function setStickyNav(html){
  var el = document.getElementById('stickynav');
  if(el) el.innerHTML = html || '';
  if(!html) SWIPE = {prev:null, next:null};
}

/* A horizontal drag moves between chapters on touch devices. Deliberately conservative:
   it must be mostly sideways, far enough to be intentional, and not a pinch — otherwise a
   diagonal scroll would fling the reader into the next chapter. */
(function(){
  var x0=0, y0=0, tracking=false;
  document.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1 || (!SWIPE.prev && !SWIPE.next)) { tracking=false; return; }
    tracking = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;   /* a scroll, not a swipe */
    var target = dx < 0 ? SWIPE.next : SWIPE.prev;                      /* drag left = onward */
    if(target) location.hash = '#/read/' + target;
  }, {passive:true});
})();

/* ---------- the next session ----------
   next-session.js carries one hand-written date in Arizona time (a fixed -07:00: the state
   keeps no daylight saving, so no timezone table is needed). The browser turns that instant
   into the reader's own local time, wherever in the world they happen to be sitting.

   A date that has gone by without being replaced is not shown as though it were still coming:
   once the session's hours have run out, the band says plainly that nothing is scheduled. */
function nsRelative(start, now){
  var a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var b = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  var days = Math.round((b - a) / 86400000);
  if(days <= 0) return 'today';
  if(days === 1) return 'tomorrow';
  if(days <= 20) return 'in ' + days + ' days';
  var weeks = Math.round(days / 7);
  return 'in ' + weeks + ' weeks';
}
function renderNextSession(){
  var el = document.getElementById('nextses');
  if(!el) return;
  var s = window.NEXT_SESSION || {};
  var start = s.when ? new Date(s.when) : null;
  if(start && isNaN(start.getTime())) start = null;     /* a typo degrades to "not scheduled" */

  var now = new Date();
  var runs = (typeof s.runsHours === 'number' && s.runsHours > 0) ? s.runsHours : 5;
  var over = start ? (now - start) > runs * 3600000 : true;

  var mid;
  if(!start || over){
    mid = '<span class="ns-k">Next Session</span>'
        + '<span class="ns-none">not yet scheduled</span>';
  } else {
    var opts = {weekday:'long', month:'long', day:'numeric'};
    if(start.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    var day, time;
    try{
      day  = start.toLocaleDateString(undefined, opts);
      time = start.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit', timeZoneName:'short'});
    }catch(e){ day = start.toDateString(); time = start.toTimeString().slice(0,5); }

    /* the table's three shapes: a room, a call, or both at once (someone always dials in) */
    var m = String(s.mode||'').toLowerCase();
    var kind = m.indexOf('hybrid')===0 ? 'hybrid' : (m.indexOf('online')===0 ? 'online' : 'inperson');
    var label = kind==='hybrid' ? 'In Person &amp; Online' : (kind==='online' ? 'Online' : 'In Person');
    var under = now >= start;                             /* begun, but not yet run out */
    mid = '<span class="ns-k">' + (under ? 'Session Under Way' : 'Next Session') + '</span>'
        + '<span class="ns-when">' + esc(day) + ' · ' + esc(time) + '</span>'
        + '<span class="ns-pill ' + kind + '">' + label + '</span>'
        + (s.where ? '<span class="ns-where">' + esc(s.where) + '</span>' : '')
        + '<span class="ns-rel' + (under?' now':'') + '">'
        + (under ? 'in session' : esc(nsRelative(start, now))) + '</span>';
  }
  el.innerHTML = '<i class="ns-line"></i><span class="ns-orn">✦</span>'
    + '<span class="ns-mid">' + mid + '</span>'
    + '<span class="ns-orn">✦</span><i class="ns-line"></i>';
}
renderNextSession();
/* A page left open overnight must not go on promising a session that has already happened. */
setInterval(renderNextSession, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) renderNextSession(); });

function showActiveTab(){
  var t = document.querySelector('.tab.active');
  var v = t ? t.dataset.view : 'contents';
  if(v==='cast') viewCast();
  else if(v==='secrets') viewSecrets();
  else if(v==='timeline') viewTimeline();
  else if(v==='map') viewMap();
  else viewContents();
}
function route(){
  var h = location.hash;
  setStickyNav('');   /* a reader view puts its own nav back; everything else stays clear */
  if(h.indexOf('#/who/')===0){ viewCast(h.slice(6)); return; }
  if(h.indexOf('#/secret/')===0){ viewSecretReader(h.slice(9)); return; }
  if(h.indexOf('#/read/')===0){ viewReader(h.slice(7)); return; }
  if(h.indexOf('#/map/')===0){ var s = h.slice(6).split('/'); viewMap(s[0], s[1]); return; }
  if(qEl.value.trim()){ search(qEl.value.trim()); return; }
  showActiveTab();
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ qEl.value=''; if(location.hash.indexOf('#/')===0) location.hash=''; setTab(t.dataset.view); route(); });
});
var timer;
qEl.addEventListener('input', function(){
  clearTimeout(timer);
  timer = setTimeout(function(){
    if(location.hash.indexOf('#/read/')===0) history.replaceState(null,'','#');
    if(qEl.value.trim()) search(qEl.value.trim()); else route();
  }, 120);
});
window.addEventListener('hashchange', route);
/* the back-to-top button appears only inside a reader, and only once there is somewhere to go back to */
(function(){
  var btn = document.getElementById('totop');
  function upd(){ btn.classList.toggle('show', window.scrollY > 600 && !!document.getElementById('reader')); }
  window.addEventListener('scroll', upd, {passive:true});
  window.addEventListener('hashchange', function(){ setTimeout(upd, 0); });
  upd();
})();
route();
</script>
</body>
</html>
